[project]
name = "discord-channel-exporter"
version = "1.0.0"
description = "Exporta todo el contenido de un canal de Discord (mensajes, embeds y adjuntos)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
discord-export = "exporter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exporter"]
